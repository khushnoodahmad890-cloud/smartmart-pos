<!doctype html>
<html>
<head><meta charset="utf-8"><style>
  body { margin:0; height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
         background:linear-gradient(135deg,#0f172a,#1e1b4b); color:#fff; font-family:system-ui,sans-serif; user-select:none; }
  .logo { width:72px; height:72px; border-radius:20px; background:#4f46e5; display:flex; align-items:center; justify-content:center; margin-bottom:18px;
          box-shadow:0 8px 40px rgba(79,70,229,.5); }
  h1 { font-size:19px; margin:0 0 6px; }
  #status { font-size:12.5px; color:#94a3b8; min-height:18px; }
  .bar { width:180px; height:3px; background:#334155; border-radius:99px; margin-top:16px; overflow:hidden; }
  .bar::after { content:''; display:block; width:40%; height:100%; background:#6366f1; border-radius:99px; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0%{transform:translateX(-100%)} 100%{transform:translateX(350%)} }
</style></head>
<body>
  <div class="logo">
    <svg width="40" height="40" viewBox="0 0 128 128" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M34 52 L40 36 L88 36 L94 52"/><path d="M30 52 H98 V92 a6 6 0 0 1 -6 6 H36 a6 6 0 0 1 -6 -6 Z"/><path d="M52 66 v14 M64 66 v14 M76 66 v14"/>
    </svg>
  </div>
  <h1>SmartMart POS</h1>
  <div id="status">Starting…</div>
  <div class="bar"></div>
</body>
</html>
